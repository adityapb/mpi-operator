
apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: charm-2
spec:
  slotsPerWorker: 1
  priority: 3
  runPolicy:
    cleanPodPolicy: Running
    ttlSecondsAfterFinished: 600
  sshAuthMountPath: /home/mpiuser/.ssh
  mpiReplicaSpecs:
    Launcher:
      maxReplicas: 1
      template:
        spec:
          containers:
          - image: adityapb/charm-netlrts:dev-new
            imagePullPolicy: Always
            name: mpi-launcher
            securityContext:
              runAsUser: 1000
            command:
            - /app/charmrun
            args:
            - /app/jacobi2d
            - "4096"
            - "512"
            - "300"
            - +balancer
            - MetisLB
            - +LBDebug
            - "3"
            - ++verbose
            resources:
              limits:
                cpu: 1
    Worker:
      minReplicas: 1
      maxReplicas: 10
      template:
        spec:
          containers:
          - image: adityapb/charm-netlrts:dev-new
            imagePullPolicy: Always
            name: mpi-worker
            securityContext:
              runAsUser: 1000
            command:
            - /usr/sbin/sshd
            args:
            - -De
            - -f
            - /home/mpiuser/.sshd_config
            resources:
              limits:
                cpu: 1
